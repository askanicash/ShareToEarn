<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn & Win - Instant Payouts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .main-wrapper { max-width: 500px; width: 100%; margin: 0 auto; }
        
        /* Banner Ads Styling */
        .banner-ad { background: #1e293b; border: 2px dashed #475569; color: #94a3b8; text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; font-weight: bold; }

        .container { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 15px; }
        h1 { text-align: center; margin-bottom: 15px; color: #38bdf8; font-size: 22px; }
        
        .card { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .balance { font-size: 26px; font-weight: bold; color: #4ade80; margin-top: 5px; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 8px; }
        .btn-task { background: #3b82f6; color: white; }
        .btn-task:hover { background: #2563eb; }
        .btn-task:disabled { background: #64748b; cursor: not-allowed; }
        .btn-withdraw { background: #10b981; color: white; }
        .btn-withdraw:hover { background: #059669; }
        
        select, input { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; }
        label { display: block; text-align: left; margin-top: 8px; font-size: 13px; color: #cbd5e1; }
        .timer { font-size: 12px; color: #facc15; margin-top: 4px; }
        
        .section-title { font-size: 16px; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #475569; padding-bottom: 5px; text-align: left; }
        .task-item { background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-info { text-align: left; font-size: 13px; }
        .task-info span { display: block; color: #94a3b8; font-size: 11px; }
        .task-btn { width: auto; padding: 8px 12px; font-size: 13px; margin-top: 0; background: #8b5cf6; }
        .task-btn:hover { background: #7c3aed; }
        .task-btn:disabled { background: #64748b; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Top Banner Ad -->
    <div class="banner-ad">
        📢 Top Banner Ad Space (Adsterra / Google Ads)
    </div>

    <div class="container">
        <h1>Earn & Win Dashboard</h1>
        
        <div class="card">
            <p>Your Total Balance</p>
            <div class="balance"><span id="userPoints">0</span> Points</div>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 4px;">Minimum Withdraw: 500 Points</p>
        </div>

        <!-- Click to Earn Tasks Section (10 Tasks) -->
        <div class="card" style="text-align: left;">
            <div class="section-title">🖱️ Click To Earn Tasks (10 Tasks)</div>
            <div id="clickTasksList"></div>
        </div>

        <!-- Watch Video Ads Tasks Section (5 Tasks) -->
        <div class="card" style="text-align: left;">
            <div class="section-title">📺 Watch Video Ads Tasks (5 Tasks)</div>
            <div id="videoTasksList"></div>
        </div>

        <!-- Withdrawal Section -->
        <div class="card" style="text-align: left;">
            <div class="section-title">💳 Request Withdrawal</div>
            
            <label>Select Payment Method:</label>
            <select id="payMethod" onchange="updateAccountPlaceholder()">
                <option value="JazzCash">JazzCash</option>
                <option value="EasyPaisa">EasyPaisa</option>
                <option value="SadaPay">SadaPay</option>
                <option value="FaucetPay">FaucetPay (Email/ID)</option>
                <option value="WebMoney">WebMoney (Z-Wallet)</option>
                <option value="Binance">Binance Pay ID / USDT</option>
            </select>

            <label>Account Number / Details:</label>
            <input type="text" id="accountDetails" placeholder="Enter your JazzCash number">

            <label>Points to Withdraw:</label>
            <input type="number" id="withdrawPoints" placeholder="Min 500 points">

            <button class="btn-withdraw" onclick="requestWithdrawal()">Withdraw via WhatsApp</button>
        </div>
    </div>

    <!-- Bottom Banner Ad -->
    <div class="banner-ad">
        📢 Bottom Banner Ad Space (Adsterra / Google Ads)
    </div>
</div>

<script>
    // Yahan apna WhatsApp number likhein (Country code ke sath, bina '+' ke, jaise 923001234567)
    const adminWhatsApp = "923001234567"; 

    let points = localStorage.getItem('user_points') ? parseInt(localStorage.getItem('user_points')) : 0;
    document.getElementById('userPoints').innerText = points;

    // Load Click Tasks (10 Tasks)
    const clickTasksList = document.getElementById('clickTasksList');
    for (let i = 1; i <= 10; i++) {
        let taskDiv = document.createElement('div');
        taskDiv.className = 'task-item';
        taskDiv.innerHTML = `
            <div class="task-info">
                Click Task #${i}
                <span>Reward: +50 Points</span>
            </div>
            <button class="task-btn" id="clickTask_${i}" onclick="completeClickTask(${i}, 50)">Claim</button>
        `;
        clickTasksList.appendChild(taskDiv);
    }

    // Load Video Tasks (5 Tasks)
    const videoTasksList = document.getElementById('videoTasksList');
    for (let i = 1; i <= 5; i++) {
        let taskDiv = document.createElement('div');
        taskDiv.className = 'task-item';
        taskDiv.innerHTML = `
            <div class="task-info">
                Watch Video Ad #${i}
                <span>Reward: +100 Points</span>
            </div>
            <button class="task-btn" id="videoTask_${i}" onclick="completeVideoTask(${i}, 100)">Watch</button>
        `;
        videoTasksList.appendChild(taskDiv);
    }

    // Check Cooldown on Load
    function checkCooldowns() {
        let now = Date.now();
        let twentyFourHours = 24 * 60 * 60 * 1000;

        // Check Click Tasks
        for (let i = 1; i <= 10; i++) {
            let lastTime = localStorage.getItem(`click_task_${i}_time`);
            if (lastTime && (now - parseInt(lastTime) < twentyFourHours)) {
                let btn = document.getElementById(`clickTask_${i}`);
                btn.disabled = true;
                btn.innerText = "Done";
            }
        }

        // Check Video Tasks
        for (let i = 1; i <= 5; i++) {
            let lastTime = localStorage.getItem(`video_task_${i}_time`);
            if (lastTime && (now - parseInt(lastTime) < twentyFourHours)) {
                let btn = document.getElementById(`videoTask_${i}`);
                btn.disabled = true;
                btn.innerText = "Done";
            }
        }
    }
    checkCooldowns();

    function completeClickTask(taskId, reward) {
        points += reward;
        localStorage.setItem('user_points', points);
        localStorage.setItem(`click_task_${taskId}_time`, Date.now());
        document.getElementById('userPoints').innerText = points;
        
        let btn = document.getElementById(`clickTask_${taskId}`);
        btn.disabled = true;
        btn.innerText = "Done";
        alert(`Task #${taskId} completed! +${reward} points added.`);
    }

    function completeVideoTask(taskId, reward) {
        alert("Please watch the video ad completely...");
        setTimeout(() => {
            points += reward;
            localStorage.setItem('user_points', points);
            localStorage.setItem(`video_task_${taskId}_time`, Date.now());
            document.getElementById('userPoints').innerText = points;
            
            let btn = document.getElementById(`videoTask_${taskId}`);
            btn.disabled = true;
            btn.innerText = "Done";
            alert(`Video Ad #${taskId} watched! +${reward} points added.`);
        }, 2000); // 2 seconds simulation for video watch
    }

    function updateAccountPlaceholder() {
        let method = document.getElementById('payMethod').value;
        let input = document.getElementById('accountDetails');
        if(method === 'JazzCash' || method === 'EasyPaisa' || method === 'SadaPay') {
            input.placeholder = `Enter your ${method} Mobile Number`;
        } else if(method === 'FaucetPay') {
            input.placeholder = `Enter FaucetPay Email or ID`;
        } else if(method === 'WebMoney') {
            input.placeholder = `Enter WebMoney Z-Wallet (e.g. Z1234...)`;
        } else if(method === 'Binance') {
            input.placeholder = `Enter Binance Pay ID or USDT Address`;
        }
    }

    function requestWithdrawal() {
        let method = document.getElementById('payMethod').value;
        let details = document.getElementById('accountDetails').value.trim();
        let wPoints = parseInt(document.getElementById('withdrawPoints').value);

        if(!details) {
            alert("Please enter your account details/number!");
            return;
        }
        if(isNaN(wPoints) || wPoints < 500) {
            alert("Minimum withdrawal limit is 500 points!");
            return;
        }
        if(wPoints > points) {
            alert("You do not have enough points!");
            return;
        }

        // Cut points instantly
        points -= wPoints;
        localStorage.setItem('user_points', points);
        document.getElementById('userPoints').innerText = points;

        // Construct WhatsApp Message
        let message = `*New Withdrawal Request*%0A%0A` +
                      `Method: ${method}%0A` +
                      `Account/Details: ${details}%0A` +
                      `Points Deducted: ${wPoints}%0A` +
                      `Status: Pending Payment`;

        // Open WhatsApp
        let whatsappURL = `https://wa.me/${adminWhatsApp}?text=${message}`;
        window.open(whatsappURL, '_blank');

        alert("Withdrawal request sent! Your points have been deducted. Complete payment on WhatsApp.");
        document.getElementById('accountDetails').value = '';
        document.getElementById('withdrawPoints').value = '';
    }
</script>

</body>
</html>
