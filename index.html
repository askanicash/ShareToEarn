<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnHub Pro - Instant Rewards</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c31;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

        /* Top & Bottom Banner Ad Boxes */
        .ad-box { background: var(--card-bg); border: 2px dashed #334155; color: var(--text-muted); text-align: center; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Header Card */
        .header-card { background: linear-gradient(135deg, #1e1b4b 0%, #131c31 100%); border: 1px solid #312e81; padding: 20px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2); }
        .header-card h1 { font-size: 20px; color: #818cf8; margin-bottom: 5px; }
        .balance-box { font-size: 32px; font-weight: 800; color: var(--success); margin: 10px 0; text-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .min-withdraw { font-size: 12px; color: var(--text-muted); }

        /* Section Styling */
        .section-card { background: var(--card-bg); border: 1px solid var(--border); padding: 18px; border-radius: 16px; }
        .section-title { font-size: 15px; font-weight: 700; color: #cbd5e1; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        /* Task Items */
        .tasks-scroll { max-height: 250px; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; }
        .tasks-scroll::-webkit-scrollbar { width: 4px; }
        .tasks-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .task-row { background: #0f172a; padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; }
        .task-info { font-size: 13px; font-weight: 500; }
        .task-info span { display: block; font-size: 11px; color: var(--success); font-weight: 600; margin-top: 2px; }
        
        .action-btn { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; text-align: center; }
        .action-btn:hover { background: var(--accent-hover); }
        .action-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        /* Form Inputs */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 13px; outline: none; transition: 0.2s; }
        select:focus, input:focus { border-color: var(--accent); }

        .btn-withdraw { width: 100%; background: var(--success); color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 5px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-withdraw:hover { background: #059669; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Ad Banner -->
    <div class="ad-box">📢 Top Ad Banner Space</div>

    <!-- Balance Dashboard -->
    <div class="header-card">
        <h1>⚡ EarnHub Pro</h1>
        <div class="balance-box"><span id="userPoints">0</span> Pts</div>
        <div class="min-withdraw">Minimum Payout: 500 Points</div>
    </div>

    <!-- Click to Earn Section (10 Tasks) -->
    <div class="section-card">
        <div class="section-title">🖱️ Click To Earn Tasks (10)</div>
        <div class="tasks-scroll" id="clickTasksList"></div>
    </div>

    <!-- Watch Video Ads Section (5 Tasks) -->
    <div class="section-card">
        <div class="section-title">📺 Watch Video Ads (5)</div>
        <div class="tasks-scroll" id="videoTasksList"></div>
    </div>

    <!-- Withdrawal Section -->
    <div class="section-card">
        <div class="section-title">💳 Instant Withdrawal</div>
        
        <div class="form-group">
            <label>Payment Method</label>
            <select id="payMethod" onchange="updatePlaceholder()">
                <option value="JazzCash">JazzCash</option>
                <option value="EasyPaisa">EasyPaisa</option>
                <option value="SadaPay">SadaPay</option>
                <option value="FaucetPay">FaucetPay (Email/ID)</option>
                <option value="WebMoney">WebMoney (Z-Wallet)</option>
                <option value="Binance">Binance Pay ID / USDT</option>
            </select>
        </div>

        <div class="form-group">
            <label>Account Number / Details</label>
            <input type="text" id="accountDetails" placeholder="Enter JazzCash mobile number">
        </div>

        <div class="form-group">
            <label>Points to Withdraw</label>
            <input type="number" id="withdrawPoints" placeholder="Min 500 points">
        </div>

        <button class="btn-withdraw" onclick="requestWithdrawal()">Withdraw via WhatsApp 🚀</button>
    </div>

    <!-- Bottom Ad Banner -->
    <div class="ad-box">📢 Bottom Ad Banner Space</div>
</div>

<script>
    // Aapka WhatsApp Number
    const adminWhatsApp = "923232605904"; 

    // Click Tasks Links
    const clickLinks = {
        1: "https://uplcm.com/4/8533673",
        2: "https://uplcm.com/4/8533888",
        3: "https://uplcm.com/4/8504845",
        4: "https://uplcm.com/4/12023375",
        5: "https://uplcm.com/4/8533675",
        6: "https://uplcm.com/4/8533672",
        7: "https://uplcm.com/4/8533674",
        8: "https://uplcm.com/4/8533676",
        9: "https://uplcm.com/4/12023521",
        10: "https://uplcm.com/4/8533675"
    };

    // Video/Ad Tasks Links
    const videoLinks = {
        1: "https://www.profitableratecpmnetwork.com/f35wyn1s?key=9726915825ca6d87b0a5a6f45a7db65f",
        2: "https://www.profitableratecpmnetwork.com/yuutn7rnk5?key=77bd2f31eab1d0564f04e1a6704aeee2",
        3: "https://www.profitableratecpmnetwork.com/mui4v4w2x?key=f4b5ca8e43b3f54d848c67c35e899f56",
        4: "https://www.profitableratecpmnetwork.com/f35wyn1s?key=9726915825ca6d87b0a5a6f45a7db65f",
        5: "https://www.profitableratecpmnetwork.com/xq4vnuhy24?key=866382d5fabda86254d02f4f1f4146f6"
    };

    let points = localStorage.getItem('user_points') ? parseInt(localStorage.getItem('user_points')) : 0;
    document.getElementById('userPoints').innerText = points;

    // Generate 10 Click Tasks (20 Points each)
    const clickList = document.getElementById('clickTasksList');
    for (let i = 1; i <= 10; i++) {
        let div = document.createElement('div');
        div.className = 'task-row';
        div.innerHTML = `
            <div class="task-info">Click Task #${i} <span>+20 Points</span></div>
            <button class="action-btn" id="click_${i}" onclick="doClickTask(${i}, 20)">Claim</button>
        `;
        clickList.appendChild(div);
    }

    // Generate 5 Video Tasks (20 Points each)
    const videoList = document.getElementById('videoTasksList');
    for (let i = 1; i <= 5; i++) {
        let div = document.createElement('div');
        div.className = 'task-row';
        div.innerHTML = `
            <div class="task-info">Video Ad #${i} <span>+20 Points</span></div>
            <button class="action-btn" id="video_${i}" onclick="doVideoTask(${i}, 20)">Watch</button>
        `;
        videoList.appendChild(div);
    }

    // Check Cooldown Status (24 Hours)
    function checkStatus() {
        let now = Date.now();
        let dayLimit = 24 * 60 * 60 * 1000;

        for (let i = 1; i <= 10; i++) {
            let t = localStorage.getItem(`click_time_${i}`);
            if (t && (now - parseInt(t) < dayLimit)) {
                let btn = document.getElementById(`click_${i}`);
                btn.disabled = true;
                btn.innerText = "Done";
            }
        }
        for (let i = 1; i <= 5; i++) {
            let t = localStorage.getItem(`video_time_${i}`);
            if (t && (now - parseInt(t) < dayLimit)) {
                let btn = document.getElementById(`video_${i}`);
                btn.disabled = true;
                btn.innerText = "Done";
            }
        }
    }
    checkStatus();

    function doClickTask(id, reward) {
        window.open(clickLinks[id], '_blank');

        points += reward;
        localStorage.setItem('user_points', points);
        localStorage.setItem(`click_time_${id}`, Date.now());
        document.getElementById('userPoints').innerText = points;
        
        let btn = document.getElementById(`click_${id}`);
        btn.disabled = true;
        btn.innerText = "Done";
    }

    function doVideoTask(id, reward) {
        window.open(videoLinks[id], '_blank');

        points += reward;
        localStorage.setItem('user_points', points);
        localStorage.setItem(`video_time_${id}`, Date.now());
        document.getElementById('userPoints').innerText = points;
        
        let btn = document.getElementById(`video_${id}`);
        btn.disabled = true;
        btn.innerText = "Done";
    }

    function updatePlaceholder() {
        let m = document.getElementById('payMethod').value;
        let input = document.getElementById('accountDetails');
        if(m === 'JazzCash' || m === 'EasyPaisa' || m === 'SadaPay') {
            input.placeholder = `Enter your ${m} mobile number`;
        } else if(m === 'FaucetPay') {
            input.placeholder = `Enter FaucetPay email or ID`;
        } else if(m === 'WebMoney') {
            input.placeholder = `Enter WebMoney Z-Wallet`;
        } else if(m === 'Binance') {
            input.placeholder = `Enter Binance Pay ID / USDT address`;
        }
    }

    function requestWithdrawal() {
        let method = document.getElementById('payMethod').value;
        let details = document.getElementById('accountDetails').value.trim();
        let wPts = parseInt(document.getElementById('withdrawPoints').value);

        if(!details) {
            alert("Please enter your account details!");
            return;
        }
        if(isNaN(wPts) || wPts < 500) {
            alert("Minimum withdrawal limit is 500 points!");
            return;
        }
        if(wPts > points) {
            alert("You do not have enough points balance!");
            return;
        }

        points -= wPts;
        localStorage.setItem('user_points', points);
        document.getElementById('userPoints').innerText = points;

        let msg = `*New Withdrawal Request*%0A%0AMethod: ${method}%0AAccount: ${details}%0APoints Deducted: ${wPts}%0AStatus: Pending`;
        window.open(`https://wa.me/${adminWhatsApp}?text=${msg}`, '_blank');

        alert("Withdrawal request sent successfully! Points deducted.");
        document.getElementById('accountDetails').value = '';
        document.getElementById('withdrawPoints').value = '';
    }
</script>

</body>
</html>
